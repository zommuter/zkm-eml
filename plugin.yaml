name: eml
version: 0.14.0
description: Convert Maildir or .eml files to markdown with thread modeling and attachment extraction.

conformance:
  config:
    source_dir: tests/fixtures/corpus

creates_dirs:
  - mail/messages
  - mail/threads
  - originals/mail
  - inbox

config:
  source_dir:
    required: false
    default: ~/mail
    description: Mail source. Maildir tree (mbsync) or flat .eml dump. Scanned recursively, read-only. Defaults to ~/mail.
  folders_exclude:
    required: false
    default:
      - Trash
      - Junk
      - Spam
      - Spamverdacht
      - Virusverdacht
      - "Gelöscht"
      - "[Google Mail]/Trash"
      - "[Google Mail]/Spam"
      - Drafts
      - "Entwürfe"
    description: Folder name patterns to skip (case-insensitive, matched on any path segment). If empty, built-in defaults apply.
  keep_originals:
    required: false
    default: true
    description: Store stripped .eml + detached attachments under originals/mail/ for --reprocess support.
  owner_addresses:
    required: false
    default: ""
    description: Comma-separated list of the store owner's email addresses. Reserved for future use by search/UI (my-identities config); not consumed during convert.
  attachment_inbox:
    required: false
    default: true
    description: Symlink detached attachments into inbox/ so other plugins (pdf, photo, recursive eml) can pick them up.
  quote_strip:
    required: false
    default: true
    description: Collapse full tail-quote blocks into a single link line referencing the parent message. Requires keep_originals=true for accurate matching. Set false to preserve raw quoted text.
  slug_ascii:
    required: false
    default: false
    description: Force ASCII-only slugs (strip accents/umlauts). Default false keeps Unicode.
  deleted_policy:
    required: false
    default: keep
    description: "What to do when a source mail is deleted between runs (git-backed sources only). Options: keep (default — preserve .md unchanged), log (preserve + stderr notice), purge (remove .md; run 'zkm gc' afterwards to clean originals), archive (mark source_deleted: true in frontmatter)."
  decoration_fanout:
    required: false
    default: true
    description: "M1 census mode: whether decoration-classified attachments (small inline cid logos/banners, tracking pixels) fan out to inbox/. Default true (unchanged — census gathers the decoration|content|unknown distribution in frontmatter+sidecars before any default flips). Set false to suppress decoration inbox symlinks (CAS storage is unaffected; nothing is lost)."
