[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zkm-eml"
version = "0.6.0"
description = "zkm plugin: convert .eml files to markdown with thread modeling"
requires-python = ">=3.11"
dependencies = [
    "python-frontmatter>=1.1",
    "markdownify>=0.13",
    "zkm",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zkm_eml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv.sources]
zkm = { path = "../zkm", editable = true }
